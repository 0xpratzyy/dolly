<!doctype html><html><head><meta charset="utf-8"><style>
:root{color-scheme:dark}
body{margin:0;background:#101012;font-family:-apple-system,'SF Pro Text',Helvetica,sans-serif;color:#f3f3f4;min-height:100vh}
.wrap{padding:220px 0 0 260px}
#card{width:300px;border-radius:20px;background:#17171a;border:1px solid rgba(255,255,255,.07);box-shadow:0 20px 50px rgba(0,0,0,.45);padding:14px;position:relative}
.row{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:12px;color:#c9c9cf;font-size:15px;cursor:pointer;transition:background .18s ease,color .18s ease}
.row:hover{background:rgba(255,255,255,.07);color:#fff}
.row .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#86E4F0,#5b7cff)}
#trigger{display:flex;justify-content:space-between;align-items:center;height:48px;padding:0 14px;border-radius:14px;background:#222226;font-weight:600;font-size:15px;cursor:pointer;transition:background .2s,transform .12s}
#trigger:active{transform:scale(.97)}
#trigger svg{transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
#trigger.open svg{transform:rotate(180deg)}
#menu{position:absolute;left:0;top:calc(100% + 8px);width:100%;background:rgba(30,30,34,.96);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.6);opacity:0;transform:translateY(-8px) scale(.96);transform-origin:top;pointer-events:none;transition:opacity .22s ease,transform .32s cubic-bezier(.2,.9,.3,1.15)}
#menu.open{opacity:1;transform:none;pointer-events:auto}
.sw{width:42px;height:24px;border-radius:12px;background:#3a3a40;margin-left:auto;position:relative;transition:background .25s}
.sw i{position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:9px;background:#fff;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:#86E4F0}.sw.on i{transform:translateX(18px)}
#count{margin-left:auto;font-variant-numeric:tabular-nums;color:#86E4F0}
</style></head><body><div class="wrap"><div id="card">
<div id="trigger" role="button">Components <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 6l5 5 5-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
<div id="menu" role="menu"><div class="row"><span class="dot"></span>Cards</div><div class="row"><span class="dot"></span>Dropdowns</div><div class="row" id="darkrow"><span class="dot"></span>Dark mode<span class="sw" id="sw"><i></i></span></div><div class="row"><span class="dot"></span>Count<span id="count">0</span></div></div></div>
</div></div><script>
const t=document.getElementById('trigger'),m=document.getElementById('menu');
t.onclick=()=>{t.classList.toggle('open');m.classList.toggle('open');if(m.classList.contains('open')){let s=null;const c=document.getElementById('count');const f=ts=>{s??=ts;const p=Math.min(1,(ts-s)/700);c.textContent=Math.round(p*128);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}};
m.onclick=e=>e.stopPropagation();
document.getElementById('darkrow').onclick=e=>{e.stopPropagation();document.getElementById('sw').classList.toggle('on')};
</script></body></html>
