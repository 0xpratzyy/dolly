<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #000; }
  body { position: relative; font-family: Figtree, sans-serif; color: #F2F3F4; }
  .c { position: absolute; border-radius: 26px; overflow: hidden; }
  .card { background: #0B0B0C; box-shadow: inset 0 0 0 1px #1E1F21; }
  /* textured cards: a Dolly wallpaper, blurred, then dithered with a dot screen and faint scanlines */
  .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .img { box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .big { font-weight: 600; font-size: 64px; line-height: 1; letter-spacing: -.04em; }
  .lbl { font-weight: 500; font-size: 24px; color: #8f9093; letter-spacing: -.01em; }
  .mono { font-family: 'DM Mono', monospace; font-weight: 400; }
  .pill { position: absolute; left: 50%; top: 315px; transform: translate(-50%, -50%); padding: 10px 40px 22px; border-radius: 34px;
    background: #0C1A20; box-shadow: inset 0 0 0 3px #17313a; }
  .pill span { font-weight: 600; font-size: 118px; line-height: 1; letter-spacing: -.035em; color: #86E4F0; }
</style></head>
<body>
  <!-- top row -->
  <div class="c card" style="left:-40px;top:-40px;width:330px;height:240px">
    <div style="position:absolute;right:30px;top:96px;text-align:right"><div class="big">1.6×</div><div class="lbl" style="margin-top:14px">Auto zoom</div></div>
  </div>
  <div class="c img" style="left:345px;top:-60px;width:510px;height:262px"><img src="codex/teal.jpg"></div>
  <div class="c card" style="left:910px;top:-40px;width:330px;height:240px">
    <div style="position:absolute;left:30px;top:96px"><div style="font-weight:600;font-size:30px;letter-spacing:-.02em">Record</div><div class="lbl mono" style="margin-top:14px;font-size:21px;line-height:1.35">60 fps · 2× capture<br>no account</div></div>
  </div>

  <!-- middle row -->
  <div class="c img" style="left:-70px;top:236px;width:205px;height:190px"><img src="codex/violet.jpg" style="object-position:85% 50%"></div>
  <div class="c img" style="left:1065px;top:236px;width:205px;height:190px"><img src="codex/violet.jpg" style="transform:scaleX(-1);object-position:85% 50%"></div>
  <div class="pill"><span>/dolly</span></div>

  <!-- bottom row -->
  <div class="c card" style="left:-40px;top:452px;width:120px;height:110px"><span class="mono" style="position:absolute;left:58px;top:44px;font-size:17px;color:#8f9093">1:1</span></div>
  <div class="c card" style="left:104px;top:452px;width:186px;height:110px"><span class="mono" style="position:absolute;left:24px;top:44px;font-size:17px;color:#8f9093">16:9 · 9:16</span></div>
  <div class="c" style="left:-40px;top:590px;width:120px;height:110px;background:#9a9a9c"></div>
  <div class="c" style="left:104px;top:590px;width:186px;height:110px;background:#F2F3F4"></div>
  <div class="c img" style="left:345px;top:428px;width:510px;height:262px"><img src="codex/ice.jpg" style="object-position:40% 60%"></div>
  <div class="c card" style="left:910px;top:452px;width:330px;height:240px">
    <div style="position:absolute;left:30px;top:40px"><div class="big">Free</div><div class="lbl" style="margin-top:12px">Open source · MIT</div></div>
  </div>
</body></html>
