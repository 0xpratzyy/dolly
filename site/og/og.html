<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0A0A0B; }
  body { position: relative; font-family: Figtree, sans-serif; color: #F2F3F4; }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(242,243,244,.09) 1px, transparent 1.2px); background-size: 12px 12px;
    -webkit-mask-image: radial-gradient(60% 70% at 72% 45%, #000, transparent 80%); }
  .glow { position: absolute; left: 860px; top: 300px; width: 900px; height: 600px; transform: translate(-50%, -50%); background: radial-gradient(closest-side, rgba(110,120,200,.16), transparent); }

  .brand { position: absolute; left: 56px; top: 52px; display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 34px; letter-spacing: -.04em; }
  .mark { width: 24px; height: 24px; border-radius: 7px; border: 3.5px solid #F2F3F4; position: relative; }
  .mark::after { content: ''; position: absolute; left: 50%; top: -8px; bottom: -8px; width: 3.5px; background: #86E4F0; transform: translateX(-50%); border-radius: 2px; }
  .h1 { position: absolute; left: 56px; top: 150px; width: 430px; font-weight: 700; font-size: 58px; line-height: 1; letter-spacing: -.045em; }
  .h1 em { font-style: normal; color: #86E4F0; }
  .sub { position: absolute; left: 56px; top: 360px; width: 400px; font-size: 18px; line-height: 1.45; color: #b8b9bb; }
  .modes { position: absolute; left: 56px; top: 440px; display: flex; flex-wrap: wrap; gap: 8px; width: 420px; }
  .modes span { font: 500 13px/1 'DM Mono', monospace; letter-spacing: .04em; color: #d6d7d9; padding: 8px 12px; border-radius: 999px; background: #161718; box-shadow: inset 0 0 0 1px #26272a; }

  .stage { position: absolute; left: 500px; top: 64px; width: 660px; height: 371px; border-radius: 20px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 40px 100px rgba(0,0,0,.6); }
  .stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .box { position: absolute; left: 764px; top: 95px; width: 140px; height: 79px; border: 2px dashed #86E4F0; border-radius: 6px; box-shadow: 0 0 0 9999px rgba(10,10,11,.28); }
  .boxwrap { position: absolute; left: 500px; top: 64px; width: 660px; height: 371px; border-radius: 20px; overflow: hidden; }
  .boxwrap .box { left: 264px; top: 31px; }
  svg.rays { position: absolute; inset: 0; }

  .inset { position: absolute; left: 610px; top: 238px; width: 540px; height: 304px; border-radius: 16px; overflow: hidden;
    box-shadow: 0 0 0 3px #86E4F0, 0 30px 90px rgba(0,0,0,.75), 0 0 70px rgba(134,228,240,.22); }
  .inset img { width: 100%; height: 100%; object-fit: cover; }
  .chip { position: absolute; left: 626px; top: 218px; z-index: 3; font: 500 14px/1 'DM Mono', monospace; color: #0A0A0B; background: #86E4F0; padding: 8px 12px; border-radius: 999px; letter-spacing: .02em; }
  .ripple { position: absolute; left: 852px; top: 348px; width: 48px; height: 48px; border-radius: 50%; border: 2.5px solid rgba(134,228,240,.95);
    box-shadow: 0 0 0 8px rgba(134,228,240,.16), 0 0 0 18px rgba(134,228,240,.06); }

  /* Dolly's editor timeline */
  .tl { position: absolute; left: 56px; right: 56px; bottom: 34px; height: 34px; }
  .tl .track { position: absolute; left: 0; right: 0; top: 10px; height: 20px; border-radius: 6px; background: #161718; box-shadow: inset 0 0 0 1px #232427; }
  .seg { position: absolute; top: 10px; height: 20px; border-radius: 6px; background: rgba(134,228,240,.16); box-shadow: inset 0 0 0 1px rgba(134,228,240,.55);
    font: 500 10.5px/20px 'DM Mono', monospace; letter-spacing: .06em; color: #86E4F0; padding-left: 8px; white-space: nowrap; overflow: hidden; }
  .ph { position: absolute; top: 0; bottom: -4px; width: 2px; background: #86E4F0; }
  .ph::before { content: ''; position: absolute; top: 0; left: -4px; width: 10px; height: 10px; background: #86E4F0; border-radius: 2px; }
  .tc { position: absolute; top: -2px; font: 500 11px/1 'DM Mono', monospace; color: #86E4F0; }
  .url { position: absolute; right: 56px; top: 62px; font: 500 15px/1 'DM Mono', monospace; color: #8b8c8e; display: none; }
</style></head>
<body>
  <div class="glow"></div><div class="dots"></div>
  <div class="brand"><span class="mark"></span>dolly</div>
  <div class="h1">Screen recordings that <em>edit themselves.</em></div>
  <div class="sub">Claude Code records your product, then zooms, glides the cursor and captions every click.</div>
  <div class="modes"><span>RECORD</span><span>AUTOPILOT</span><span>NARRATE</span><span>SPOTLIGHT</span></div>

  <div class="stage"><img src="rec-0.2.jpg"></div>
  <div class="boxwrap"><div class="box"></div></div>
  <svg class="rays" width="1200" height="630"><g stroke="#86E4F0" stroke-width="1.5" stroke-dasharray="4 5" opacity=".7" fill="none">
    <line x1="764" y1="95" x2="610" y2="238"/><line x1="904" y1="95" x2="1150" y2="238"/>
  </g></svg>
  <div class="inset"><img src="inset.jpg"></div>
  <div class="ripple"></div>
  <div class="chip">AUTO ZOOM 1.6×</div>

  <div class="tl">
    <div class="track"></div>
    <div class="seg" style="left:6%;width:15%">ZOOM 1.6×</div>
    <div class="seg" style="left:31%;width:11%">ZOOM 1.9×</div>
    <div class="seg" style="left:52%;width:19%">ZOOM 1.4×</div>
    <div class="seg" style="left:80%;width:12%">ZOOM 1.6×</div>
    <div class="ph" style="left:13%"></div>
  </div>
  <div class="url">dolly.refs.video</div>
</body></html>
